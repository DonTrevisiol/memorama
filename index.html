<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Memorama Japonés</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div id="menu">
    <h1>Memorama Japonés</h1>

    <div class="modo">
      <button id="btn-hiragana" class="btn-main">Hiragana ひらがな</button>
      <button id="btn-katakana" class="btn-main">Katakana　カタカナ</button>
    </div>

    <div class="checks">
      <label>
        <input type="checkbox" id="dakuten">
        Incluir Dakuten
      </label>

      <label>
        <input type="checkbox" id="handakuten">
        Incluir Handakuten
      </label>
    </div>

    <button id="comenzar" class="btn-start">Comenzar</button>
  </div>

  <div id="game" class="hidden">
    <h2>Intentos: <span id="intentos">0</span></h2>
    <div id="game-board"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
